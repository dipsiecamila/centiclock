name: Compilar APK Android (Sin Android Studio)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK para teléfono
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci || npm install

      - name: 🔨 Compilar Frontend (Vite)
        run: npm run build

      - name: 📱 Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🔧 Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: 🏗️ Compilar APK (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Subir APK generado como Artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: USPS-Dolly-Clock-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
