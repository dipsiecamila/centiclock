<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141c2c"/>
      <stop offset="100%" stop-color="#070a11"/>
    </radialGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer border ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#amberGold)" stroke-width="8" opacity="0.3"/>
  <circle cx="256" cy="256" r="200" fill="#090d16" stroke="url(#amberGold)" stroke-width="5"/>

  <!-- Centesimal 100 ticks around perimeter -->
  <g stroke="#f59e0b" opacity="0.7">
    <!-- Major ticks at every 10 cmin -->
    <line x1="256" y1="62" x2="256" y2="82" stroke-width="5"/>
    <line x1="256" y1="430" x2="256" y2="450" stroke-width="5"/>
    <line x1="62" y1="256" x2="82" y2="256" stroke-width="5"/>
    <line x1="430" y1="256" x2="450" y2="256" stroke-width="5"/>
    <!-- Diagonal major ticks -->
    <line x1="119" y1="119" x2="133" y2="133" stroke-width="4"/>
    <line x1="393" y1="119" x2="379" y2="133" stroke-width="4"/>
    <line x1="119" y1="393" x2="133" y2="379" stroke-width="4"/>
    <line x1="393" y1="393" x2="379" y2="379" stroke-width="4"/>
  </g>

  <!-- Centesimal markings text (0, 25, 50, 75) -->
  <text x="256" y="112" fill="#fbbf24" font-family="system-ui, sans-serif" font-weight="900" font-size="28" text-anchor="middle">00</text>
  <text x="410" y="266" fill="#fbbf24" font-family="system-ui, sans-serif" font-weight="900" font-size="28" text-anchor="middle">25</text>
  <text x="256" y="420" fill="#fbbf24" font-family="system-ui, sans-serif" font-weight="900" font-size="28" text-anchor="middle">50</text>
  <text x="102" y="266" fill="#fbbf24" font-family="system-ui, sans-serif" font-weight="900" font-size="28" text-anchor="middle">75</text>

  <!-- Center Hub & Hands -->
  <!-- Hour hand (short) pointing ~ 10 -->
  <line x1="256" y1="256" x2="175" y2="185" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
  <!-- Centesimal minute hand (long amber) pointing ~ 18 -->
  <line x1="256" y1="256" x2="345" y2="155" stroke="url(#amberGold)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Center circle cap -->
  <circle cx="256" cy="256" r="16" fill="#f59e0b"/>
  <circle cx="256" cy="256" r="6" fill="#070a11"/>

  <!-- USPS Dolly badge -->
  <rect x="176" y="300" width="160" height="32" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="256" y="322" fill="#fbbf24" font-family="system-ui, sans-serif" font-weight="800" font-size="14" letter-spacing="3" text-anchor="middle">USPS DOLLY</text>
</svg>
